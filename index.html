<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>3D 24시간 편의점</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container"></div>
    <div id="instructions">
        <h2>24시간 편의점</h2>
        <p>WASD 또는 방향키로 이동</p>
        <p>마우스로 시점 회전</p>
    </div>
    <div id="item-popup" class="hidden">
        <h3>상점 아이템</h3>
        <p>상품을 확인할 수 있습니다</p>
    </div>
    
    <!-- 모바일 컨트롤 -->
    <div id="mobile-controls">
        <div class="control-group">
            <div class="direction-pad">
                <button class="control-btn up" data-direction="forward">▲</button>
                <button class="control-btn left" data-direction="left">◀</button>
                <button class="control-btn right" data-direction="right">▶</button>
                <button class="control-btn down" data-direction="backward">▼</button>
            </div>
            <div class="action-buttons">
                <button class="action-btn" id="rotate-left">↺</button>
                <button class="action-btn" id="rotate-right">↻</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="firebase-integration.js"></script>
    <script src="app.js?v=4"></script>
</body>
</html>
